name: Clone funnel
on:
  pull_request:
    paths:
      - 'cloud-apps/clone/**'
      - '.github/workflows/clone.yml'
  push:
    branches: [main]
    paths:
      - 'cloud-apps/clone/**'
      - '.github/workflows/clone.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-apps/clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud-apps/clone/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:readiness:browser
      - run: npm run test:whop:browser
      - run: npm run test:sandbox:mock
