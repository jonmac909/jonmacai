<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Comparison studio · Jon Mac</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101112; color: #f2f2f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: auto; padding: 48px 28px 64px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid #333639; }
    .eyebrow { margin: 0 0 12px; color: #b7bbbf; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.06; font-weight: 800; letter-spacing: -.045em; }
    .intro { margin: 16px 0 0; max-width: 64ch; color: #b7bbbf; line-height: 1.6; }
    a { color: #f2f2f2; text-underline-offset: 4px; }
    a:hover { color: #c7d4e2; }
    a:focus-visible, button:focus-visible, select:focus-visible, video:focus-visible, textarea:focus-visible { outline: 3px solid #a9c6e6; outline-offset: 4px; }
    button, .project { border: 1px solid #50555a; border-radius: 8px; padding: 12px 16px; font: inherit; font-size: .875rem; font-weight: 700; color: #f2f2f2; background: #24272a; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #333a42; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .project { display: inline-block; text-decoration: none; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    [hidden] { display: none !important; }
    #status { color: #b7bbbf; margin: 22px 0; line-height: 1.5; overflow-wrap: anywhere; }
    #modules { display: grid; gap: 24px; padding: 0; margin: 0; list-style: none; }
    .card { min-width: 0; padding: 24px; border: 1px solid #34373b; border-radius: 12px; background: #181a1c; }
    .card-heading { display: flex; gap: 14px; align-items: baseline; margin-bottom: 18px; }
    .number { color: #a7adb4; font-size: .875rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    h2 { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
    h3 { margin: 0 0 12px; font-size: .9375rem; }
    .players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .player { min-width: 0; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #090a0b; object-fit: contain; border-radius: 6px; }
    .details, .pair-controls, .note-state { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: .875rem; }
    .details { justify-content: space-between; }
    label { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: #b7bbbf; }
    select { min-height: 44px; max-width: 100%; padding: 8px 28px 8px 10px; font: inherit; color: #f2f2f2; background: #24272a; border: 1px solid #545a60; border-radius: 6px; }
    .clip-label, .reference-title { color: #b7bbbf; overflow-wrap: anywhere; }
    .reference-title { margin: 14px 0 0; font-size: .875rem; line-height: 1.5; }
    .media-status, .note-status, #export-status { color: #b7bbbf; font-size: .8125rem; line-height: 1.5; }
    .media-status { margin: 12px 0 0; }
    .pair-controls .media-status, .note-status { margin: 0; }
    .notes { margin-top: 24px; padding-top: 20px; border-top: 1px solid #34373b; }
    textarea { display: block; width: 100%; min-height: 110px; resize: vertical; margin-top: 10px; padding: 12px; border: 1px solid #545a60; border-radius: 6px; color: #f2f2f2; background: #101112; font: inherit; line-height: 1.5; }
    #export-fallback { margin-bottom: 24px; }
    #export-text { min-height: 220px; }
    noscript { display: block; padding: 24px 0; }
    @media (max-width: 700px) {
      main { padding: 28px 16px 40px; }
      header { align-items: start; flex-direction: column; }
      #modules { gap: 18px; }
      .players { grid-template-columns: 1fr; gap: 24px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Jon Mac · Creative review</p>
        <h1>Comparison studio</h1>
        <p class="intro">G01–G14, paired with matching Sabri graphic references. Compare timing, typography and texture. Scrub each clip independently; Play Both starts from each current playhead.</p>
      </div>
      <div class="header-actions">
        <button id="export" type="button" disabled>Export All Notes</button>
        <a class="project" id="project" hidden>Open Frame project ↗</a>
      </div>
    </header>
    <p id="status" role="status">Loading review modules…</p>
    <p id="export-status" role="status"></p>
    <div id="export-fallback" hidden>
      <label for="export-text">All notes as Markdown — select and copy this text</label>
      <textarea id="export-text" readonly></textarea>
    </div>
    <noscript>JavaScript is required to load this batch's video manifest.</noscript>
    <ol id="modules" aria-label="Video modules G01 through G14" aria-busy="true"></ol>
  </main>
  <script>
    const status = document.getElementById("status");
    const modules = document.getElementById("modules");

    function sameOriginUrl(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      try {
        const url = new URL(value, location.href);
        return url.origin === location.origin && ["http:", "https:"].includes(url.protocol) && !url.username && !url.password ? url.href : null;
      } catch { return null; }
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function bindPair(videos, button, message) {
      let attempt = 0;
      let pending = false;
      let pauseRequested = false;
      const running = () => videos.some(video => !video.paused && !video.ended);
      function update() {
        button.textContent = pending || running() ? "Pause Both" : "Play Both";
        button.disabled = !pending && !running() && videos.some(video => !video.getAttribute("src") || video.error);
      }
      function pause() {
        attempt++;
        pending = false;
        pauseRequested = true;
        videos.forEach(video => video.pause());
        update();
      }
      button.addEventListener("click", () => {
        if (pending || running()) {
          pause();
          message.textContent = "Both paused. Playheads remain independent.";
          return;
        }
        const currentAttempt = ++attempt;
        pending = true;
        pauseRequested = false;
        message.textContent = "Starting both clips…";
        update();
        try {
          videos.forEach(video => { if (video.ended) video.currentTime = 0; });
          const starts = videos.map(video => {
            let start;
            try { start = video.play(); } catch (error) { return Promise.reject(error); }
            return Promise.resolve(start).then(() => {
              // A cancelled start must never restart playback after a newer Pause Both.
              if (currentAttempt !== attempt && pauseRequested) video.pause();
            });
          });
          Promise.all(starts).then(() => {
            if (currentAttempt !== attempt) return;
            pending = false;
            message.textContent = "Playing from independent playheads. Each clip stops at its own end.";
            update();
          }).catch(error => {
            if (currentAttempt !== attempt) return;
            pause();
            message.textContent = error?.name === "NotAllowedError" ? "Playback was blocked. Both paused; use the individual controls or try Play Both again." : "Could not play both clips. Both paused; check the player messages and try again.";
          });
        } catch {
          pause();
          message.textContent = "Could not start both clips. Both paused; check the player messages and try again.";
        }
      });
      videos.forEach(video => {
        ["play", "playing", "pause", "ended", "emptied", "loadedmetadata"].forEach(event => video.addEventListener(event, () => {
          if (event === "pause" && pending && video.paused && !video.ended) {
            pause();
            message.textContent = "Start cancelled. Both paused.";
          }
          if (event === "ended" && !pending) message.textContent = videos.every(clip => clip.ended) ? "Both clips ended. Play Both replays them." : "One clip ended; the other keeps its independent playhead.";
          update();
        }));
        video.addEventListener("error", () => {
          pause();
          message.textContent = "A clip could not be loaded. Both paused; check the player messages.";
        });
      });
      update();
      return { pause, update };
    }

    function bindNotes(projectId, moduleId, textarea, message, retry) {
      const key = `batch-notes:${encodeURIComponent(projectId)}:${moduleId}`;
      let edited = false;
      function save() {
        try {
          localStorage.setItem(key, textarea.value);
          message.textContent = "Saved · on this device";
          retry.hidden = true;
        } catch {
          message.textContent = "Not saved on this device. Keep this page open or export your notes.";
          retry.textContent = "Retry saving notes";
          retry.hidden = false;
        }
      }
      function loadNotes() {
        try {
          const saved = localStorage.getItem(key);
          textarea.value = saved ?? "";
          message.textContent = saved === null ? "Notes stay on this device and save as you type." : "Saved · on this device";
          retry.hidden = true;
        } catch {
          message.textContent = "Saved notes could not be loaded. Retry before editing to avoid replacing stored notes.";
          retry.textContent = "Retry loading notes";
          retry.hidden = false;
        }
      }
      textarea.addEventListener("input", () => { edited = true; save(); });
      retry.addEventListener("click", () => edited ? save() : loadNotes());
      loadNotes();
    }

    function renderModule(module, projectId) {
      const item = element("li", undefined, "card");
      const heading = element("div", undefined, "card-heading");
      const title = element("h2", module.title);
      title.id = `${module.id}-title`;
      heading.append(element("span", module.id, "number"), title);
      const players = element("div", undefined, "players");
      function player(label, suffix) {
        const column = element("section", undefined, "player");
        const name = element("h3", label);
        name.id = `${module.id}-${suffix}`;
        const video = element("video");
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.setAttribute("aria-labelledby", `${title.id} ${name.id}`);
        video.textContent = "Your browser does not support native video playback.";
        const message = element("p", undefined, "media-status");
        message.id = `${name.id}-status`;
        message.setAttribute("role", "status");
        video.setAttribute("aria-describedby", message.id);
        column.append(name, video);
        players.append(column);
        return { column, video, message };
      }
      const reference = player("Sabri Reference", "reference");
      const render = player("JonMac Render", "render");
      const referenceTitle = module.reference?.title || "Reference title unavailable";
      reference.column.append(element("p", referenceTitle, "reference-title"), reference.message);
      const referenceUrl = sameOriginUrl(module.reference?.video_url);
      if (referenceUrl) {
        reference.video.src = referenceUrl;
        reference.message.textContent = "Loading reference metadata…";
      } else {
        reference.message.textContent = "Reference unavailable: no valid same-origin media URL.";
      }
      reference.video.addEventListener("loadedmetadata", () => { reference.message.textContent = "Reference ready to play."; });
      reference.video.addEventListener("error", () => { reference.message.textContent = "Reference could not be loaded. Reload the page to retry."; });
      const pairControls = element("div", undefined, "pair-controls");
      const pairButton = element("button", "Play Both");
      pairButton.type = "button";
      pairControls.setAttribute("role", "group");
      pairControls.setAttribute("aria-label", `Paired playback for ${module.id}`);
      const pairMessage = element("p", "Playheads remain independent. Ended clips restart with Play Both.", "media-status");
      pairMessage.setAttribute("role", "status");
      pairControls.append(pairButton, pairMessage);
      const pair = bindPair([reference.video, render.video], pairButton, pairMessage);
      const video = render.video;
      const mediaStatus = render.message;
      const details = element("div", undefined, "details");
      const comments = element("a", "Open comments ↗");
      let unavailableComments = false;

      function selectClip(clip) {
        pair.pause();
        pairMessage.textContent = "Both paused. Playheads remain independent; the selected render starts at the beginning.";
        video.removeAttribute("src");
        video.removeAttribute("poster");
        comments.removeAttribute("href");
        comments.hidden = true;
        const mediaUrl = sameOriginUrl(clip?.video_url);
        const reviewUrl = sameOriginUrl(clip?.review_url);
        const posterUrl = sameOriginUrl(clip?.poster_url);
        unavailableComments = !reviewUrl;
        if (reviewUrl) {
          comments.href = reviewUrl;
          comments.hidden = false;
          comments.setAttribute("aria-label", `Open comments for ${module.id}, ${clip.label || "selected render"}`);
        }
        if (posterUrl) video.poster = posterUrl;
        if (mediaUrl) {
          video.src = mediaUrl;
          mediaStatus.textContent = "Loading video metadata…";
        } else {
          mediaStatus.textContent = "Video unavailable: no valid same-origin media URL." + (unavailableComments ? " Comments are not available." : "");
        }
        video.load();
        pair.update();
      }

      video.addEventListener("loadedmetadata", () => {
        mediaStatus.textContent = unavailableComments ? "Comments are not available for this clip." : "Ready to play. Comments open in Frame.";
      });
      video.addEventListener("error", () => {
        mediaStatus.textContent = "Video could not be loaded. Reload the page or open this clip in Frame." + (unavailableComments ? " Comments are not available." : "");
      });

      if (module.clips.length > 1) {
        const label = element("label", "Variant");
        const select = element("select");
        select.setAttribute("aria-label", `Variant for ${module.id}: ${module.title}`);
        module.clips.forEach((clip, index) => {
          const option = element("option", clip?.label || `Variant ${index + 1}`);
          option.value = String(index);
          select.append(option);
        });
        select.addEventListener("change", () => selectClip(module.clips[Number(select.value)]));
        label.append(select);
        details.append(label);
      } else {
        details.append(element("span", module.clips[0]?.label || "No published clip", "clip-label"));
      }
      details.append(comments);
      render.column.append(details, mediaStatus);
      const notes = element("div", undefined, "notes");
      const noteLabel = element("label", `${module.id} notes · timing, typography, texture`);
      const textarea = element("textarea");
      textarea.id = `${module.id}-notes`;
      noteLabel.htmlFor = textarea.id;
      textarea.placeholder = "e.g. 00:03 — match the headline timing; soften the grain…";
      const noteState = element("div", undefined, "note-state");
      const noteMessage = element("p", undefined, "note-status");
      noteMessage.id = `${module.id}-notes-status`;
      noteMessage.setAttribute("role", "status");
      textarea.setAttribute("aria-describedby", noteMessage.id);
      const retry = element("button");
      retry.type = "button";
      retry.hidden = true;
      noteState.append(noteMessage, retry);
      notes.append(noteLabel, textarea, noteState);
      bindNotes(projectId, module.id, textarea, noteMessage, retry);
      item.append(heading, players, pairControls, notes);
      selectClip(module.clips[0]);
      return item;
    }

    async function load() {
      try {
        const response = await fetch("/batch/modules.json", { cache: "no-store", credentials: "same-origin", redirect: "error" });
        if (!response.ok) throw new Error(response.status === 404 ? "The review manifest has not been published yet." : "The review manifest could not be loaded.");
        const manifest = await response.json();
        const ids = Array.from({ length: 14 }, (_, index) => `G${String(index + 1).padStart(2, "0")}`);
        if (!manifest || typeof manifest.project_id !== "string" || !manifest.project_id.trim() ||
            !["string", "number"].includes(typeof manifest.revision) ||
            !Array.isArray(manifest.modules) || manifest.modules.length !== 14 ||
            manifest.modules.some(module => !module || !ids.includes(module.id) || typeof module.title !== "string" || !module.title.trim() || !Array.isArray(module.clips)) ||
            new Set(manifest.modules.map(module => module.id)).size !== 14) {
          throw new Error("The review manifest is incomplete or invalid. It must contain G01–G14.");
        }
        const projectUrl = new URL("/frame/", location.origin);
        projectUrl.searchParams.set("p", manifest.project_id);
        const project = document.getElementById("project");
        project.href = projectUrl.href;
        project.hidden = false;
        const ordered = ids.map(id => manifest.modules.find(module => module.id === id));
        modules.replaceChildren(...ordered.map(module => renderModule(module, manifest.project_id)));
        const exportButton = document.getElementById("export");
        exportButton.disabled = false;
        exportButton.addEventListener("click", async () => {
          const markdown = `# Comparison notes\n\nProject: ${manifest.project_id}\n\n` + ordered.map(module =>
            `## ${module.id} — ${module.title}\n\nSabri reference: ${module.reference?.title || "Reference title unavailable"}\n\n${document.getElementById(`${module.id}-notes`).value}\n`
          ).join("\n");
          const exportStatus = document.getElementById("export-status");
          const fallback = document.getElementById("export-fallback");
          const text = document.getElementById("export-text");
          exportButton.disabled = true;
          exportStatus.textContent = "Copying all notes…";
          text.value = markdown;
          try {
            await navigator.clipboard.writeText(markdown);
            fallback.hidden = true;
            exportStatus.textContent = "Copied all 14 modules and notes as Markdown.";
          } catch {
            fallback.hidden = false;
            exportStatus.textContent = "Clipboard unavailable. All 14 modules and notes are shown below; select and copy the text manually.";
            text.focus();
            text.select();
          } finally {
            exportButton.disabled = false;
          }
        });
        status.textContent = `14 module comparisons · Revision ${manifest.revision} · Notes are local to this browser, not sent to Frame.`;
      } catch (error) {
        status.textContent = error instanceof SyntaxError ? "The review manifest is not valid JSON. No videos have been loaded." : error.message || "The review could not be loaded. Please reload the page.";
      } finally {
        modules.setAttribute("aria-busy", "false");
      }
    }
    load();
  </script>
</body>
</html>
