<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Jon Mac Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
.login{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem}
.login .card{width:min(24rem,100%)}
.login label{display:block;font-weight:500;margin:.8rem 0 .35rem}
.login input[type=password]{width:100%;box-sizing:border-box;padding:.7rem .8rem;border:1px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font:inherit}
.login .err{color:var(--crit-ink);font-weight:500;min-height:1.3rem;margin:.6rem 0 0}
.login .remember{display:flex;align-items:center;gap:.5rem;margin:1rem 0;color:var(--ink-2);font-size:.9rem}
.login .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
</style>
<div class="login">
  <form class="card pad" id="f" autocomplete="current-password">
    <div class="top">
      <div class="brand" style="padding:0"><i>JM</i>Jon Mac</div>
      <div class="theme" role="group" aria-label="Theme"><button type="button" data-theme-set="light">Light</button><button type="button" data-theme-set="dark">Dark</button></div>
    </div>
    <h1 style="margin:0 0 .3rem;font-size:1.35rem;font-weight:600">Command center</h1>
    <p style="margin:0;color:var(--muted);font-size:.9rem">Sign in to see today’s numbers.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" required autofocus>
    <label class="remember"><input type="checkbox" checked> Remember this device for 30 days</label>
    <button class="btn wide" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<script type="module">
const root=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function curTheme(){return root.getAttribute('data-theme')||(mq&&mq.matches?'dark':'light')}
function syncTheme(){const c=curTheme();document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===c)))}
function setTheme(t){root.setAttribute('data-theme',t);try{localStorage.setItem('cc-theme',t)}catch{}syncTheme()}
let saved=null;try{saved=localStorage.getItem('cc-theme')}catch{}
if(saved==='light'||saved==='dark')setTheme(saved);else syncTheme();
document.addEventListener('click',e=>{const th=e.target.closest('[data-theme-set]');if(th)setTheme(th.dataset.themeSet)});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const res=await fetch('/dashboard/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-CC':'1'},body:JSON.stringify({password:document.getElementById('pw').value})});
  const body=await res.json().catch(()=>({}));
  if(res.ok){location.href='/dashboard/';return}
  err.textContent=body.error||'Wrong password. Try again.';
});
</script>
