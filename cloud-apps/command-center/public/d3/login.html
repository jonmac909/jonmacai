<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Jon Mac Control room</title>
<script>try{if(localStorage.getItem('d3-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/dash/css/d3.css">
</head>
<body>
<div class="d3">
<div class="login">
<form class="card" id="f" autocomplete="current-password">
<div class="hd">
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; background: #2563eb; color: #ffffff; font-size: 13px; font-weight: 700">JM</span>
<div style="display: flex; flex-direction: column; line-height: 1.25"><b style="font-size: 15px; font-weight: 600">Jon Mac</b><span class="mut" style="font-size: 12px">Control room</span></div>
</div>
<h1>Sign in</h1>
<label for="pw" class="sub" style="font-weight: 500">Password</label>
<input id="pw" name="password" type="password" required autofocus>
<label class="rm"><input type="checkbox" checked> Remember this device for 30 days</label>
<button class="btn primary" type="submit">Sign in</button>
<p class="err" id="err" role="alert"></p>
</form>
</div>
</div>
<script type="module">
// Same sign-in as /dashboard and /dashboard-2: the session cookie covers every path, so a reload shows Dashboard 3.
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/dashboard/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CC': '1' }, body: JSON.stringify({ password: document.getElementById('pw').value }) }).catch(() => null);
  const body = res ? await res.json().catch(() => ({})) : {};
  if (res && res.ok) {
    try { sessionStorage.removeItem('d3-signin'); } catch {}
    if (location.pathname === '/dash/') location.reload(); else location.href = '/dash/';
    return;
  }
  err.textContent = body.error || 'Wrong password. Try again.';
});
</script>
</body>
</html>
