<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jon Mac Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.500V15h8v-1.500A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></symbol>
  <symbol id="i-dollar" viewBox="0 0 24 24"><path d="M12 3v18M16 7.500c0-1.700-1.800-2.500-4-2.500s-4 .8-4 2.700c0 4 8 2.300 8 6.300 0 1.900-1.800 2.800-4 2.800s-4-1-4-2.800"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.500 11h10L20 7H6.500M9 19.500h.01M17 19.500h.01"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.500 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></symbol>
</svg>
<div class="shell">
<aside class="side">
  <div class="brand"><i>JM</i>Jon Mac<div class="theme" role="group" aria-label="Theme"><button type="button" data-theme-set="light" aria-pressed="false">Light</button><button type="button" data-theme-set="dark" aria-pressed="false">Dark</button></div></div>
  <button class="primary" id="startMorning">Start my morning</button>
  <nav class="navs" aria-label="Areas" id="navs"></nav>
  <div class="plan">
    <div class="ring"><div class="donut" id="donut"><span id="donutpct">50%</span></div><div><strong id="goallabel">$10K SPONSOR GOAL</strong><small id="goalsub">12 days left in September</small></div></div>
    <button class="softbtn" data-page="sponsors">See sponsors</button>
  </div>
</aside>
<main class="main"><div class="wrap" id="page"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="morningModal" class="modal">
  <form method="dialog" class="modal-card">
    <h2>Start my morning</h2>
    <p class="note">Checks stay on this Kelowna day only. Nothing auto-ticks from empty queues.</p>
    <div id="morningSteps" class="steps"></div>
    <menu><button value="close" class="btn line">Close</button></menu>
  </form>
</dialog>
<dialog id="draftModal" class="modal">
  <form method="dialog" class="modal-card">
    <h2>Review draft</h2>
    <label>To <input name="to" type="email"></label>
    <label>Subject <input name="subject"></label>
    <label>Body <textarea name="body" rows="10"></textarea></label>
    <menu>
      <button type="button" class="btn line" data-draft-act="discard">Discard</button>
      <button type="button" class="btn line" data-draft-act="save">Save</button>
      <button type="button" class="btn" data-draft-act="send">Send</button>
      <button value="close" class="btn line">Close</button>
    </menu>
  </form>
</dialog>
<script type="module" src="js/app.js"></script>
