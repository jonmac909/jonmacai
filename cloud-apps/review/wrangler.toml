# jonmac.ai/review: private video review portal for the AI channels.
# Secrets (wrangler secret put, never committed): REVIEW_SHARE_KEY, REVIEW_PASSCODE,
# REVIEW_SESSION_SECRET, REVIEW_API_TOKEN. See README "Video review portal".
name = "jonmac-review"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
# "jonmac.ai/review" alone does not match "/review?k=..." (routes cannot name query strings),
# so the share link would fall through to the main site. "review*" covers /review, /review?k=
# and /review/<slug>; no other jonmac.ai page starts with /review.
routes = [
  { pattern = "jonmac.ai/review*", zone_name = "jonmac.ai" },
  { pattern = "jonmac.ai/api/review/*", zone_name = "jonmac.ai" }
]

[version_metadata]
binding = "REVIEW_VERSION"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "jonmac-review"
database_id = "aaf91d9f-48f9-458a-aa6d-24354266a39b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jonmac-review-media"
