# jonmac.ai/review: private video review portal for the AI channels.
# Secrets (wrangler secret put, never committed): REVIEW_SHARE_KEY, REVIEW_PASSCODE,
# REVIEW_SESSION_SECRET, REVIEW_API_TOKEN. See README "Video review portal".
name = "jonmac-review"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
# "jonmac.ai/review" alone does not match "/review?k=..." (routes cannot name query strings),
# so the share link would fall through to the main site. "review*" covers /review, /review?k=
# and /review/<slug>; no other jonmac.ai page starts with /review.
routes = [
  { pattern = "jonmac.ai/review*", zone_name = "jonmac.ai" },
  { pattern = "jonmac.ai/api/review/*", zone_name = "jonmac.ai" }
]

[version_metadata]
binding = "REVIEW_VERSION"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "jonmac-review"
database_id = "aaf91d9f-48f9-458a-aa6d-24354266a39b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jonmac-review-media"

# Approve / Submit changes go to the video's dashboard card, and the list reads which versions QC passed
# (command-center src/reviewhook.js, authorised with the REVIEW_API_TOKEN both Workers already hold).
[[services]]
binding = "DASHBOARD"
service = "jonmac-command-center"

# Preview: own Worker on workers.dev (no jonmac.ai routes), own D1 and R2, wired to the dashboard preview.
# Preview-only secrets (never prod values): D:\AgentTeam\secrets\review-preview.env.
# Deploy: npx --yes wrangler@4.160.0 deploy --env preview --tag <sha>
[env.preview]
name = "jonmac-review-preview"
workers_dev = true
preview_urls = false
routes = []
vars = { PREVIEW = "1" }

[env.preview.version_metadata]
binding = "REVIEW_VERSION"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "jonmac-review-preview"
database_id = "b79434f1-f704-4326-aee8-746c9e6a0abd"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "jonmac-review-media-preview"

[[env.preview.services]]
binding = "DASHBOARD"
service = "jonmac-command-center-preview"
