name = "jonmac-watch"
main = "worker.js"
compatibility_date = "2026-09-08"
workers_dev = false
routes = [
  { pattern = "jonmac.ai/watch", zone_name = "jonmac.ai" },
  { pattern = "jonmac.ai/watch/*", zone_name = "jonmac.ai" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
VIDEO_KEY = "watch/viralview-2-launch-v1.mp4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "frame-media"
