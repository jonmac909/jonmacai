name = "jonmac-watch"
main = "worker.js"
compatibility_date = "2026-09-08"
workers_dev = false
routes = [
  { pattern = "jonmac.ai/watch", zone_name = "jonmac.ai" },
  { pattern = "jonmac.ai/watch/*", zone_name = "jonmac.ai" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
